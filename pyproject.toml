[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-gap-agent"
version = "0.1.0"
description = "SciVerse-grounded research agent with DeepSeek tool calling"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2,<3",
    "openai>=2,<3",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
